<!DOCTYPE html>
<html>

<body>
    <h1>Insert Valid File Type</h1>
    <h2>png, jpeg, m4a, mp3, wav, mp4, avi, mov, mpeg-2</h2>
    <form action="/insert_submit" method="POST" enctype="multipart/form-data">
        <div>
            <label for="user-file">Choose a file:</label>
            <input type="file" id="user-file" name="user-file" required>
        </div>
        <button type="submit">Submit</button>
    </form>

</body>


</html>
